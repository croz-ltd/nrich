# Main Continuous Integration workflow

name: Build

on:
  push:
    branches:
      - master
      - feature_*
      - bugfix_*
  pull_request:
    branches:
      - master
      - feature_*
      - bugfix_*

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        java: ["17"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - JDK ${{ matrix.java }}

    steps:
      - name: Support long paths for Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only the primary OS saves the dependency cache; the rest reuse it
          # read-only so they don't race on downloads (Maven Central rate limits)
          cache-read-only: ${{ matrix.os != 'ubuntu-latest' }}

      - name: Build
        run: ./gradlew clean build

      - name: JaCoCo Coverage Report
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: ./gradlew jacocoTestReport testCodeCoverageReport

      - name: Publish JaCoCo Coverage Report
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v7
        with:
          name: Aggregated JaCoCo Report
          files: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml

      - name: Aggregate Javadoc
        if: ${{ matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master' && github.event_name == 'push' }}
        run: ./gradlew aggregateJavadoc

      - name: Deploy Javadoc to GitHub Pages
        if: ${{ matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master' && github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: build/docs/aggregateJavadoc
          target-folder: docs
          clean: true
          single-commit: true
